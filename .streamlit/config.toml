# 로고 와인레드(#980120)를 메인 색으로. 나머지 색은 Streamlit 기본 라이트/다크 그대로.
# 라이트·다크를 둘 다 적어야 앱 설정 메뉴의 모드 전환이 유지된다.
# 안내 박스(st.info)는 blue 토큰을 쓰므로 배경과 비슷한 연한 무채색 베이지로 둔다.
[theme.light]
primaryColor = "#980120"
blueColor = "#8E8880"
blueBackgroundColor = "#F8F7F4"
blueTextColor = "#5F5A53"

[theme.dark]
primaryColor = "#980120"
backgroundColor = "#0E1013"
secondaryBackgroundColor = "#26272B"
textColor = "#D8D9DC"
blueColor = "#9F9A92"
blueBackgroundColor = "#1E1F21"
blueTextColor = "#D6D2CB"

# 사이드바: 라이트는 따뜻한 아이보리 바탕 + 연한 웜톤 테두리, 다크는 Streamlit 기본색에서 푸른기만 살짝 뺀 색
[theme.light.sidebar]
backgroundColor = "#FBFAF7"
borderColor = "#E6E1D6"

[theme.dark.sidebar]
backgroundColor = "#26272B"
textColor = "#D8D9DC"
